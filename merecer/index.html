<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Merecer · 21 minutos</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--bg:#13100c;--card:#1d1813;--card2:#251f18;--line:#3a3127;--text:#f3ede2;--muted:#bdb19c;--gold:#c9a24a;--gold2:#e4c67f;--ok:#7fd6a4;--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.55 var(--sans)}
.top{position:sticky;top:0;z-index:5;background:rgba(19,16,12,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:640px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.top img{width:30px;height:30px;border-radius:50%;flex:none}
.top .meta{flex:1;min-width:0;display:flex;flex-direction:column}
#fase{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2)}
#min{font-size:13px;color:var(--muted)}
.icon{background:none;border:1px solid var(--line);color:var(--text);border-radius:999px;min-height:40px;padding:0 14px;font:500 14px var(--sans);cursor:pointer}
.bar{height:4px;background:var(--line)}#fill{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
main{max-width:640px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.hero{background:linear-gradient(180deg,var(--card2),var(--card))}
h1,h2{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:clamp(34px,8vw,46px)}h2{font-size:clamp(25px,6vw,31px)}
.gold{color:var(--gold2)}
p{margin:0}.lead{font-size:18px;color:var(--text)}.sub{color:var(--muted);font-size:15px}
.eyebrow,.pk{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.mini{margin:0;padding-left:20px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.nota{font-size:14px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px}.row.center{justify-content:center}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 24px;border-radius:999px;border:0;background:var(--gold);color:#1a140c;font:700 16px var(--sans);text-decoration:none;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.sm{min-height:38px;font-size:13px;padding:0 14px}
.btn:focus-visible,.opt:focus-visible,.icon:focus-visible,summary:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;width:100%;min-height:56px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font:400 16px/1.4 var(--sans);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--gold)}
.opt.sel{border-color:var(--gold);background:#2f2618}
.opt.check::before{content:"";flex:none;width:20px;height:20px;border:1.5px solid var(--muted);border-radius:6px;order:-1}
.opt.check.sel::before{background:var(--gold);border-color:var(--gold);box-shadow:inset 0 0 0 4px #2f2618}
.opt span{flex:1;min-width:0}
.tag{font:500 11px var(--sans);font-style:normal;color:#1a140c;background:var(--gold2);border-radius:6px;padding:2px 6px;flex:none}
.punto{border-left:3px solid var(--gold);background:#231c12;border-radius:0 12px 12px 0;padding:16px;display:flex;flex-direction:column;gap:10px;animation:in .35s ease}
.punto p{font-size:17px}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
input[type=text]{font:400 18px var(--sans);min-height:52px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);width:100%}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.pausa{align-items:center;text-align:center}
.breath{width:96px;height:96px;border-radius:50%;background:radial-gradient(circle,var(--gold2),var(--gold) 60%,transparent 70%);animation:breath 8s ease-in-out infinite;opacity:.9}
@keyframes breath{0%,100%{transform:scale(.6);opacity:.5}50%{transform:scale(1);opacity:1}}
.niveles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.niveles span{font-size:12px;text-align:center;padding:8px 4px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.niveles span.on{background:var(--gold);border-color:var(--gold);color:#1a140c;font-weight:700}
.mapa{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.mapa li{display:flex;flex-direction:column;gap:6px}
.mn{font-size:15px}.mn i{color:var(--gold2);font-style:normal;font-size:13px}
.mb{height:10px;border-radius:99px;background:var(--line);overflow:hidden}.mb b{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px}
.uno{border-color:var(--gold)}.big{font-family:var(--serif);font-size:24px;line-height:1.25;color:var(--gold2)}
.precio{font-weight:700;color:var(--gold2)}
details summary{cursor:pointer;font-weight:500}
.det{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:14px}
.det li{display:flex;flex-direction:column;gap:4px}.det span{color:var(--gold2)}.det em{color:var(--muted);font-style:normal;font-size:15px}
.intent{border:1px dashed var(--gold);border-radius:14px;padding:16px 18px;background:#1a1712;display:flex;flex-direction:column;gap:8px}.intent p{font-size:15px;color:var(--text)}
.planes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.plan{border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:8px;background:var(--card2)}
.plan.destacado{border-color:var(--ok)}
.pn{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pp{font-family:var(--serif);font-size:30px;font-weight:600}.pp small{font-family:var(--sans);font-size:14px;color:var(--muted);font-weight:400}
.ahorro{color:var(--ok);font-weight:700;font-size:15px}
.pp s{font-family:var(--sans);font-size:18px;font-weight:400;color:var(--muted);text-decoration-thickness:1.5px}
#prueba{max-width:640px;margin:0 auto 32px;padding:12px max(16px,env(safe-area-inset-left,0px));font:400 13px/1.5 ui-monospace,monospace;color:var(--muted);border-top:1px dashed var(--line);word-break:break-word}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ===== Contenido: Merecer · 21 minutos (prototipo) =====
   Niveles: 1 = la que tiene la información · 2 = la que sabe y aplica · 3 = la que integra
   Cada opción: [nivel, texto de la opción, punto de conciencia]                         */

var NIVELES={
 1:{nombre:"La que tiene la información",
    desc:"Sabés mucho de lo que querés cambiar: leíste, escuchaste, probaste afirmaciones y pensamiento positivo. Pero en el día a día todavía respondés en automático, con los demás y con vos. Tu conversación interna suele ser dura, y muchas veces priorizás agradar antes que agradarte. No es poco: ya miraste hacia adentro. Lo que falta es pasar de saber a aplicar, de a 1%.",
    paso:{nombre:"Domingos del 1%",precio:"",texto:"Un encuentro semanal para pasar de la información a la acción, acompañada y sin culpa ni reproche."}},
 2:{nombre:"La que sabe y aplica",
    desc:"Ya empezaste a aplicar: cambiaste cómo te hablás y cómo les hablás a otros, prestás atención a cómo te sentís y empezaste a priorizarte. Lo que todavía falta es integrarlo en todas las áreas de tu vida. A veces te identificás con el proceso (“estoy trabajando esto”), y eso te mantiene en camino, pero sin llegar.",
    paso:{nombre:"Reto 21 días",precio:"$150.000",texto:"21 días para dejar de estar “en proceso” e integrar lo que ya sabés en cada área de tu vida."}},
 3:{nombre:"La que integra · la mujer del 1%",
    desc:"Ya no decís “estoy trabajando esto”. Te sentís completa, merecedora y reconocida, sin necesitar que nadie te lo diga ni decírselo a nadie. Tus innegociables son claros y no te quedás donde no pertenecés. Sabés que tu realidad se construye con cada palabra que elegís.",
    paso:{nombre:"[Siguiente paso a definir]",precio:"",texto:"Un espacio para mujeres que ya integran y quieren sostenerlo y expandirlo."}}
};

var DOMINGOS={nombre:"Domingos del 1%",texto:"Ya tenés el ebook y tu resultado. Los Domingos son donde lo aplicás: un encuentro en vivo cada semana, una herramienta por vez, acompañada y sin culpa ni reproche.",
 planes:[{id:"mensual",nombre:"Mensual",antes:"$65.000",precio:"$49.000",detalle:"el primer mes",bono:"Bono especial por tener el ebook: ahorrás $16.000 el primer mes. Después, $65.000 por mes.",destacado:true},
         {id:"trimestral",nombre:"Trimestral",precio:"$120.000",detalle:"por 3 meses",ahorro:"Ahorrás $75.000 (38%) frente a pagar 3 meses sueltos"}]};
var AUTO={nunca:"Nunca hizo nada de autoconocimiento",escucho:"Escuchó o leyó, pero no practica",probe:"Probó alguna vez (taller, terapia, retiro)",regular:"Practica con regularidad",estilo:"Es su estilo de vida"};

var PATRONES={
 da:{nombre:"La que da y no recibe",desc:"Sos generosa con todos, pero cuando algo llega para vos aparece la necesidad de devolverlo enseguida. En algún momento aprendiste que el amor se gana dando.",
     accion:"Esta semana, cuando alguien te dé algo (un elogio, una ayuda, un regalo), respondé solo “gracias” y respirá una vez antes de decir cualquier otra cosa."},
 gana:{nombre:"La que se lo tiene que ganar",desc:"Sentís que lo bueno llega recién después de esforzarte lo suficiente. Y lo suficiente nunca termina de llegar.",
     accion:"Una vez por día, hacé algo agradable para vos sin habértelo ganado: 30 segundos de sol, un café tranquilo, una canción entera."},
 achica:{nombre:"La que se achica",desc:"Para no incomodar ni quedar expuesta, le bajás el volumen a lo que sos, a lo que sabés y a lo que querés.",
     accion:"Una vez por día, decí una opinión tuya en una sola frase, sin poner “no sé” ni “capaz” adelante."},
 permiso:{nombre:"La que espera permiso",desc:"Antes de disfrutar o de decidir, esperás que alguien te confirme que está bien.",
     accion:"Tomá una decisión chica por día sin consultarla con nadie: qué comer, qué ponerte, a dónde ir."},
 recibe:{nombre:"La que recibe",desc:"Recibir ya no te incomoda: sabés que lo bueno también es para vos.",
     accion:"Elegí el área de tu mapa donde más te cuesta y llevá ahí la misma forma de recibir que ya tenés."}
};

var GRUPOS={recibir:"Recibir",cuidarte:"Cuidarte",voz:"Tu voz",decisiones:"Tus decisiones"};
var AREAS={pareja:"Tu pareja",ex:"Tu historia anterior",amor:"El amor que querés",hijos:"Tus hijos",familia:"Tu familia de origen",amistades:"Tus amistades",trabajo:"Tu trabajo",clientes:"Tu emprendimiento",dinero:"El dinero",yo:"Vos misma"};

/* ---------- Fase 1: perfil (ramificado) ---------- */
var PERFIL=[
 {id:"p_nombre",tipo:"texto",t:"¿Cómo te gusta que te llamen?",sub:"Lo vas a ver solo vos, en tu resultado."},
 {id:"p_edad",t:"¿Qué edad tenés?",o:[["25-34","Entre 25 y 34"],["35-44","Entre 35 y 44"],["45-54","Entre 45 y 54"],["55+","55 o más"]]},
 {id:"p_pareja",t:"¿Cómo está hoy tu vida amorosa?",o:[["enpareja","Estoy en pareja o casada"],["separada","Me separé o me divorcié"],["buscando","Estoy sola y me gustaría estar en pareja"],["sola","Estoy sola y elijo estarlo"],["confuso","Estoy en un vínculo que no sé bien qué es"]]},
 {id:"p_hijos",t:"¿Tenés hijos?",o:[["chicos","Sí, chicos (hasta 12 años)"],["adolescentes","Sí, adolescentes"],["adultos","Sí, ya adultos"],["no","No"],["deseo","No, y es un tema para mí"]]},
 {id:"p_origen",t:"En tu familia de origen, ¿qué lugar ocupás?",o:[["unica","Soy hija única"],["mayor","Soy la mayor"],["medio","Soy la del medio"],["menor","Soy la menor"]]},
 {id:"p_fam",t:"¿Con quién de tu familia de origen sentís hoy más peso?",

 {id:"p_presencia",when:function(c){return /madre|padre|ambos|hermana|hermano|crianza/.test(c.fam||"")},

  o:function(c){var pl=c.fam==="ambos";var o=[["cerca","Sí, y tenemos contacto frecuente"],["lejos","Sí, pero con poco contacto"]];if(pl)o.push(["uno","Uno de los dos ya no está"]);o.push(["partio",pl?"Ya no están":"Ya no está"]);return o}},
 {id:"p_trabajo",t:"¿A qué te dedicás hoy?",o:[["empleada","Trabajo en relación de dependencia"],["emprende","Emprendo o trabajo por mi cuenta"],["casa","Me dedico a mi casa y mi familia"],["ambas","Trabajo en relación de dependencia y también emprendo"],["busca","Estoy buscando trabajo o en transición"]]},
 {id:"p_foco",tipo:"multi",max:2,t:"¿Qué vínculo querés mejorar primero?",sub:"Elegí uno o dos. Las preguntas se van a abrir según lo que elijas.",

   if(c.pareja==="enpareja"||c.pareja==="confuso")o.push(["pareja","Con mi pareja"]);

];

var DIAG=[
 {id:"d1",t:"Cuando escuchás hablar de merecimiento, ¿qué te pasa?",o:[
  [1,"Sé mucho del tema: leí, escuché, hice afirmaciones. Pero en mi día a día sigo igual.","Tener la información es el primer escalón, y ya lo subiste. El salto no es saber más: es aplicar una cosa chica, hoy."],
  [2,"Empecé a aplicarlo: me priorizo más que antes, aunque me cuesta sostenerlo en todo.","Ya lo estás viviendo, no solo pensando. Lo que sigue es llevarlo a las áreas donde todavía no entró."],
  [3,"No lo pienso como un tema: me siento merecedora y desde ahí elijo.","Cuando el merecimiento deja de ser un tema, se vuelve una forma de estar. Eso es integrar."]]},
 {id:"d2",t:"Alguien te pide un favor que no querés hacer.",o:[
  [1,"Digo que sí, y después me enojo conmigo.","Cada sí que no sentís es un no a vos misma. El enojo de después es tu cuerpo avisándote."],
  [2,"A veces digo que no, y me quedo un rato justificándome.","Ya ponés límites. La justificación posterior es la culpa reacomodándose; con práctica se acorta."],
  [3,"Digo que no con calma, sin explicar de más.","Un no claro es una forma de respeto, para vos y para el otro."]]},
 {id:"d3",t:"Después de equivocarte, tu voz interna suena más a…",o:[
  [1,"“Siempre lo mismo, nunca aprendo.”","Le hablás a vos como nunca le hablarías a una amiga. Esa voz se aprendió, y por eso se puede cambiar."],
  [2,"“Bueno, estoy en proceso, estoy trabajando esto.”","Es un gran cambio. Fijate si “estoy en proceso” no se volvió tu nueva identidad: a veces es una forma elegante de no terminar de elegirte."],
  [3,"“Me equivoqué. ¿Qué elijo ahora?”","Sin drama y sin etiqueta. Esa sola pregunta ya es una acción de 1%."]]},
 {id:"d4",t:"Cuando lográs algo importante…",o:[
  [1,"Lo minimizo, o siento que fue suerte.","Achicar tus logros te protege de quedar expuesta, pero también le confirma a tu mente que no los merecés."],
  [2,"Lo celebro y lo cuento: me costó mucho llegar.","Celebrar está bien. Fijate si necesitás contarlo para que sea real, o si ya es real para vos."],
  [3,"Lo disfruto. No necesito contarlo para que sea real.","Tu logro no necesita testigos. Esa es la seguridad de quien ya se reconoce."]]},
 {id:"d5",patron:true,t:"Cuando algo bueno llega a tu vida, lo primero que aparece es…",o:[
  ["da","Pensar cómo devolverlo o compensarlo","Si recibir te deja en deuda, aprendiste que el amor se paga. Hoy alcanza con notarlo."],
  ["gana","Sentir que todavía no hice lo suficiente para merecerlo","El “todavía no” es una meta que se corre siempre un poco más lejos. Lo bueno no se gana: se recibe."],
  ["achica","Bajarle el precio para no incomodar a nadie","Achicarte para que nadie se incomode tiene un costo: te incomodás vos."],
  ["permiso","Esperar a que alguien me confirme que está bien disfrutarlo","Esperar permiso es dejar la llave de tu bienestar en manos de otro. Esa llave es tuya."],
  ["recibe","Recibirlo con gratitud","Recibir con gratitud, sin cuentas pendientes, es merecimiento integrado."]]}
];

/* ---------- Fase 3: las 21 preguntas (generales) ---------- */
var GENERAL=[
 /* ===== R · Reconocer: qué siente, qué nota, qué aparece en su cuerpo y en su mente =====
    El orden es la prioridad: si eligió 1 o 2 vínculos, se quitan las últimas. */
 {id:"R1",fase:"R",patron:true,g:"recibir",t:"Cuando algo bueno llega a tu vida, ¿qué es lo primero que sentís?",o:[
  ["da","Ganas de devolverlo o compensarlo enseguida.","Si recibir te deja en deuda, en algún momento aprendiste que el amor se paga. Hoy alcanza con notarlo, sin culpa ni reproche."],
  ["gana","Que todavía no hice lo suficiente para merecerlo.","El “todavía no” es una meta que se corre siempre un poco más lejos. Lo bueno no se gana: se recibe."],
  ["achica","Ganas de bajarle el precio para no incomodar a nadie.","Achicarte para que nadie se incomode tiene un costo: te incomodás vos."],
  ["permiso","Necesidad de que alguien me confirme que está bien disfrutarlo.","Esperar permiso es dejar la llave de tu bienestar en manos de otro. Esa llave es tuya."],
  ["recibe","Gratitud. Lo recibo sin cuentas pendientes.","Recibir con gratitud, sin deber nada a cambio, es merecimiento integrado. Registrá cómo se siente en el cuerpo: es tu referencia."]]},
 {id:"R7",fase:"R",auto:true,t:"¿Practicaste alguna terapia holística, actividad de desarrollo personal o algo que te lleve a conocerte más?",o:[
  ["nunca","No, nunca hice nada de esto.","Empezar a mirarte por primera vez es valiente. Este recorrido ya es un primer paso de reconocimiento."],
  ["escucho","Escuché o leí sobre el tema, pero no lo practico.","Tenés la información. Lo que falta es llevarla al cuerpo y al día a día, de a 1%."],
  ["probe","Probé alguna vez: un taller, una terapia, un retiro.","Ya sabés lo que se siente mirar hacia adentro. La diferencia la hace la constancia, no la intensidad."],
  ["regular","Sí, lo practico con regularidad.","Tu práctica ya es parte de tu semana. Fijate si también llega a las áreas donde todavía te cuesta."],
  ["estilo","Es parte de mi estilo de vida.","El autoconocimiento ya es tu forma de vivir. Lo que sigue es integrarlo sin identificarte con el proceso."]]},
 {id:"R2",fase:"R",g:"voz",t:"Cuando querés decir algo y te frenás, ¿lo notás en el cuerpo?",o:[
  [1,"No me doy cuenta en el momento. Lo noto después, cuando ya pasó.","El cuerpo avisa antes que la mente: un nudo, calor, la garganta cerrada. Empezar a notarlo, aunque sea después, ya es reconocimiento."],
  [2,"Sí, siento algo (en la garganta, el pecho, la panza), aunque no siempre sé qué es.","Ya escuchás la señal. El próximo paso es ponerle nombre: ¿es miedo, vergüenza, enojo? Nombrarlo le baja el volumen."],
  [3,"Lo reconozco enseguida y sé qué me está diciendo.","Leer tu cuerpo en el momento te da la posibilidad de elegir en lugar de reaccionar."]]},
 {id:"R3",fase:"R",g:"recibir",t:"Te dicen: “Qué bien lo hiciste”. ¿Qué sentís por dentro?",o:[
  [1,"Incomodidad. Quiero que cambien de tema.","Esa incomodidad es miedo a quedar expuesta, incluso para bien. Cada vez que esquivás un elogio, le confirmás a tu mente que no lo merecés."],
  [2,"Me gusta, pero una parte mía duda de que sea verdad.","La parte que duda es una voz vieja. Más tarde, repetite el elogio en voz baja: es tu forma de recibirlo dos veces."],
  [3,"Lo siento verdadero y lo disfruto.","Recibís el reconocimiento sin agrandarlo ni achicarlo. Eso es presencia genuina."]]},
 {id:"R4",fase:"R",g:"voz",t:"Cuando algo te molesta, ¿cuánto tardás en darte cuenta?",o:[
  [1,"Mucho. Me doy cuenta días después, o cuando exploto.","Si te das cuenta tarde, es porque aprendiste a no sentir para no molestar. Lo que no se reconoce se acumula hasta que desborda."],
  [2,"Lo noto en el momento, pero no siempre sé bien qué siento.","Ya lo registrás a tiempo. Preguntate “¿qué siento?” y “¿qué necesito?”: dos preguntas que ordenan."],
  [3,"Lo reconozco enseguida y puedo nombrar qué siento.","Nombrar lo que sentís en el momento es la base de una comunicación sin reproche."]]},
 {id:"R5",fase:"R",g:"recibir",t:"Te das un gusto: una comida, una salida, algo para vos. ¿Qué sentís después?",o:[
  [1,"Culpa. Pienso en quién lo necesitaba más, o en lo que gasté.","La culpa después del disfrute dice “primero los demás”. Notarla ya es empezar a soltarla."],
  [2,"Bienestar, aunque siento que lo tengo que justificar.","Disfrutás, pero todavía rendís cuentas. ¿A quién le estás explicando? Muchas veces es una voz vieja, no una persona real."],
  [3,"Bienestar. No necesito justificar lo que elijo para mí.","El disfrute sin culpa es señal de que te sentís digna de lo bueno."]]},
 {id:"R6",fase:"R",g:"cuidarte",t:function(c){return c.hijos==="chicos"?"Tus hijos están con alguien más y tenés dos horas libres. ¿Qué sentís?":"Es domingo a la tarde y no tenés nada pendiente. ¿Qué sentís?"},o:[
  [1,"Culpa de estar quieta. Enseguida busco algo para hacer.","Si descansar te genera culpa, en algún momento aprendiste que tu valor depende de lo que hacés. Tu valor no se gana: ya está."],
  [2,"Alivio, pero la cabeza sigue repasando lo que falta.","Le diste lugar al descanso, y eso es un cambio real. Ahora el desafío es que la cabeza también descanse, no solo el cuerpo."],
  [3,"Calma. Descansar es parte de mi vida.","El descanso no es un premio para vos: es parte de tu vida. Esa es una de las marcas de una mujer que integra."]]},

 /* ===== C · Comunicar: cómo se habla a sí misma y cómo les habla a los demás ===== */
 {id:"C1",fase:"C",g:"voz",t:"Cuando algo te sale mal, ¿cómo te hablás?",o:[
  [1,"Con dureza: “otra vez lo mismo, no aprendo más”.","Esa voz no nació con vos: la aprendiste. Probá hablarte como le hablarías a tu mejor amiga, aunque sea una sola frase."],
  [2,"Me corrijo: “estoy en proceso, estoy trabajando esto”.","Fijate si “estoy en proceso” no se volvió una forma de quedarte en el camino. La integración empieza cuando dejás de presentarte como alguien que se está arreglando."],
  [3,"“Me equivoqué. ¿Qué elijo ahora?”","Te hablás con respeto y vas directo a la elección. Así se ve una conversación interna potenciadora."]]},
 {id:"C2",fase:"C",g:"voz",t:function(c){return /chicos|adolescentes/.test(c.hijos||"")?"Llegás cansada y te piden algo más (en tu casa o en el trabajo) que no querés hacer. ¿Qué respondés?":"Te piden algo que no querés hacer. ¿Qué respondés?"},o:[
  [1,"Digo que sí, y después me arrepiento y me enojo conmigo.","Cada sí que no sentís te aleja un poco de vos. Ese arrepentimiento es información: te muestra dónde está tu límite."],
  [2,"A veces digo que no, y me quedo un rato dándole vueltas.","Ya ponés límites. Las vueltas son la culpa acomodándose; con práctica se acortan."],
  [3,"Digo que no con calma, sin explicar de más.","Un no tranquilo cuida el vínculo más que un sí con enojo."]]},
 {id:"C3",fase:"C",g:"voz",t:"Alguien dice algo con lo que no estás de acuerdo. ¿Qué decís?",o:[
  [1,"Nada. Me callo para no generar conflicto.","Callarte te protege de la exposición, pero te deja afuera de tu propia vida. Tu opinión también merece lugar."],
  [2,"Lo digo, pero lo suavizo tanto que casi no se entiende.","Ya hablás. El próximo 1% es decir una sola frase clara, sin almohadones."],
  [3,"Lo digo con respeto, aunque el otro no esté de acuerdo.","No necesitás que te den la razón para sostener lo que pensás. Eso es presencia."]]},
 {id:"C4",fase:"C",g:"voz",t:"Te piden que hables frente a otras personas, o que te muestres en una foto o un video. ¿Qué respondés?",o:[
  [1,"Busco cualquier excusa para no hacerlo.","Evitar la exposición alivia en el momento, pero confirma el miedo. Una micro exposición de 10 segundos ya cambia el mensaje."],
  [2,"Digo que sí, pero después me reviso una y otra vez.","Te mostrás, y eso es enorme. Revisarte después es el último resto del miedo: soltalo de a 1%."],
  [3,"Digo que sí y me muestro desde lo que soy, sin buscar aprobación.","Mostrarte sin buscar aprobación es la libertad que muchas mujeres están buscando."]]},
 {id:"C5",fase:"C",g:"voz",t:"Algo que hizo una persona cercana te dolió. ¿Cómo se lo decís?",o:[
  [1,"No se lo digo. Hago como si nada y me lo guardo.","Lo que se guarda no desaparece: se acumula. Reconocer que te dolió, aunque sea solo para vos, ya es un movimiento."],
  [2,"Se lo digo, pero en forma de reproche.","Te animás a expresarlo, y eso es valiente. El paso siguiente es hablar de lo que sentiste en vez de lo que el otro hizo mal."],
  [3,"Le digo lo que sentí, sin culpar ni culparme.","Hablar desde lo que sentís, sin reproche, es comunicación potenciadora."]]},
 {id:"C6",fase:"C",g:"voz",t:"Necesitás ayuda con algo. ¿Cómo la pedís?",o:[
  [1,"No la pido. Prefiero arreglármelas sola.","Arreglártelas sola parece fortaleza, pero muchas veces es miedo a molestar. Pedir no te hace menos: te da la posibilidad de ser sostenida."],
  [2,"La pido, pero con tantas explicaciones que parece que pido perdón.","Ya pedís, y eso es un paso grande. Contá cuántas explicaciones agregás: cada una es una forma de pedir permiso para necesitar."],
  [3,"La pido con claridad, y acepto si me dicen que no.","Pedir sin aferrarte a la respuesta es libertad. Tu valor no depende del sí del otro."]]},
 {id:"C7",fase:"C",g:"decisiones",t:"¿Qué tan fácil te resulta decir en voz alta “esto es lo que quiero”?",o:[
  [1,"Me cuesta. A veces ni siquiera tengo claro qué quiero.","Cuando pasaste mucho tiempo atenta a lo que quieren los demás, tu deseo queda en voz baja. Se recupera escuchándolo de a poco."],
  [2,"Lo sé, pero al decirlo me da vergüenza parecer egoísta.","Querer algo para vos no es egoísmo: es información sobre quién sos."],
  [3,"Lo digo con naturalidad. Lo que quiero también importa.","Tu deseo tiene voz propia. Desde ahí se construyen vínculos más sanos."]]},

 /* ===== M · Moverte: qué hace, qué elige, qué acción sostiene ===== */
 {id:"M1",fase:"M",g:"decisiones",t:"Leés o escuchás algo que te inspira (un libro, un video, un podcast, una frase). ¿Qué hacés después?",o:[
  [1,"Lo guardo o lo comparto, pero en mi día a día no cambio nada.","Esta es la diferencia entre tener la información y aplicarla. No hace falta aplicar todo: alcanza con una acción chica, hoy."],
  [2,"Intento aplicarlo unos días, hasta que la rutina me gana.","Ya pasás a la acción. Lo que falta es que sea tan chico que la rutina no pueda ganarle: eso es el 1%."],
  [3,"Elijo una sola acción chica y la hago ese mismo día.","Convertir la inspiración en acción el mismo día es integrar."]]},
 {id:"M2",fase:"M",g:"decisiones",t:"Llega un momento de presión. ¿Qué hacés con tus innegociables (lo que no estás dispuesta a resignar)?",o:[
  [1,"No sé bien cuáles son. Me adapto a lo que haga falta.","Adaptarte siempre te deja sin centro. Elegir un solo innegociable esta semana es un gran 1%."],
  [2,"Los tengo claros, pero bajo presión termino cediendo.","Saberlos ya es mucho. Sostenerlos se entrena en lo chico, no en lo grande."],
  [3,"Los sostengo. Me muevo desde ellos.","Tus innegociables te ordenan. No necesitás explicarlos: los vivís."]]},
 {id:"M3",fase:"M",g:"decisiones",t:"Estás en un lugar o un grupo donde no te sentís bien. ¿Qué hacés?",o:[
  [1,"Me quedo para no quedar mal.","Quedarte para no quedar mal tiene un costo: tu energía. Notar ese costo es el primer paso para elegir."],
  [2,"Me voy, aunque me cuesta y me siento rara.","Ya elegís irte. Esa rareza es tu cuerpo acostumbrándose a una nueva forma de cuidarte."],
  [3,"Me voy con naturalidad, sin dar explicaciones.","Sabés dónde pertenecés. No necesitás pelearte con lo que no es para vos."]]},
 {id:"M4",fase:"M",g:"decisiones",t:"Aparece una oportunidad que te entusiasma, pero te da miedo. ¿Qué hacés?",o:[
  [1,"La dejo pasar: siento que no estoy lista.","“No estoy lista” muchas veces es el miedo disfrazado de prudencia. Nadie se siente lista antes de empezar."],
  [2,"Digo que sí, pero me preparo de más antes de mostrarme.","Prepararte está bien. Prepararte de más puede ser otra forma de postergarte."],
  [3,"Doy el paso y aprendo en el camino.","Te movés aunque haya miedo. Eso es confianza en acción."]]},
 {id:"M5",fase:"M",g:"cuidarte",t:"Empezás un hábito nuevo para vos. ¿Qué pasa con el paso de los días?",o:[
  [1,"Arranco con todo y a los pocos días lo dejo.","Arrancar con todo es la trampa. El 1% funciona porque es tan chico que se puede cumplir."],
  [2,"Lo sostengo un tiempo, pero si fallo un día me castigo.","Fallar un día no borra lo que hiciste. Volver sin culpa ni reproche es lo que lo sostiene."],
  [3,"Lo hago parte de mi vida, sin exigencias.","Cuando el hábito es parte de quién sos, ya no hace falta fuerza de voluntad."]]},
 {id:"M6",fase:"M",g:"cuidarte",t:"¿Qué hacés con el tiempo que es solo tuyo, sin que nadie te necesite?",o:[
  [1,"Casi no lo tengo. Siempre hay algo o alguien antes.","Si no hay tiempo para vos, no es un problema de agenda: es de prioridad. Cinco minutos por día ya son tu 1%."],
  [2,"Lo reservo, pero lo cedo cuando alguien me necesita.","Ya lo defendés. Notá cuándo lo cedés por elección y cuándo por culpa."],
  [3,"Lo cuido como un innegociable.","Tu tiempo es sagrado y lo sabés. Por eso, cuando das, das con más presencia."]]},
 {id:"M7",fase:"M",g:"recibir",t:"Una persona cercana te pide mucho y te da poco. ¿Qué hacés?",o:[
  [1,"Sigo dando igual, aunque me agote.","Si siempre das más de lo que recibís, el vínculo está desequilibrado. Moverte no es castigar a nadie: es cuidarte."],
  [2,"Empiezo a dar menos, aunque me siento culpable.","Ya ajustás. La culpa es el precio de salir del rol de siempre, y va bajando."],
  [3,"Lo hablo y ajusto el vínculo, o tomo distancia.","Vínculos de ida y vuelta: eso es ser sostenida, no mantenida."]]}
];

 ex:{

   [2,"Lo que aprendí, aunque todavía me duele un poco.","Aprender sin negar el dolor es honesto. Cuidá que ese aprendizaje no se vuelva tu nueva identidad."],

  M:{t:"¿Qué estás lista para hacer distinto de ahora en adelante?",o:[
   [1,"No sé si confío en mí para elegir mejor.","Esa desconfianza se entiende. Se reconstruye eligiendo bien en lo chico: un café, una conversación, un límite."],
   [2,"Poner primero mis innegociables, aunque me dé miedo quedarme sola.","Poner tus innegociables primero es elegirte. El miedo a quedarte sola pierde fuerza cuando te tenés."],
   [3,"Ya lo hago: elijo desde lo que soy, no desde lo que me falta.","Elegir desde la plenitud cambia a quién atraés y a quién dejás ir."]]}},
 amor:{
  R:{t:"Cuando imaginás la pareja que querés, ¿qué aparece primero?",o:[
   [1,"Que alguien me elija, que por fin me vea.","Querer ser elegida es humano. Pero si esperás que otro te vea primero, le das la llave de tu valor."],
   [2,"Lo tengo claro, aunque a veces dudo de merecerlo.","La claridad ya está. La duda es lo que falta integrar: merecerlo no depende de cumplir requisitos."],
   [3,"Alguien con quien compartir lo que ya tengo, no alguien que me complete.","Desde ahí se construyen los vínculos más sanos: compartir, no completar."]]},
  C:{t:"Alguien te interesa. ¿Cómo te mostrás?",o:[
   [1,"Me adapto a lo que creo que le gusta.","Adaptarte para gustar te agota, y la otra persona termina conociendo a alguien que no sos vos."],
   [2,"Me muestro, pero me freno cuando siento que soy “demasiado”.","¿Demasiado para quién? Lo que tenés para dar no necesita recortes."],
   [3,"Me muestro tal cual soy. Quien tenga que quedarse, se queda.","Mostrarte entera es el mejor filtro que existe."]]},
  M:{t:"¿Qué vas a dejar de aceptar en tu próximo vínculo?",o:[
   [1,"Todavía no lo sé. Al principio me cuesta poner límites.","El principio es justo cuando más importan. Elegí un solo límite y practicalo en el próximo encuentro."],
   [2,"Lo sé, pero me da miedo espantar a alguien.","Si un límite sano espanta a alguien, te ahorró tiempo. Tus innegociables te cuidan."],
   [3,"Lo tengo claro y lo sostengo desde el primer día.","Los límites claros desde el inicio son amor propio y respeto por el otro."]]}},
 hijos:{
  R:{t:function(c){return "Cuando dedicás tiempo a vos en lugar de a "+c.hijosTxt+", ¿qué sentís?"},o:[
   [1,"Culpa. Siento que les estoy quitando algo.","La culpa de madre es de las más aprendidas. Una mamá que se cuida les enseña a sus hijos que cuidarse está permitido."],
   [2,"Lo hago, aunque una voz me dice que soy egoísta.","Esa voz no es tuya: la heredaste. Vas por buen camino."],
   [3,"Lo vivo con tranquilidad: cuidarme también es cuidarlos.","Les mostrás con tu ejemplo qué es merecer."]]},
  C:{t:function(c){return c.hijos==="adultos"?"Cuando tus hijos te piden algo que no querés dar (tiempo, dinero, ayuda), ¿cómo respondés?":"Cuando "+c.hijosTxt+" te hablan mal o te exigen, ¿cómo respondés?"},o:[
   [1,"Me enojo, o cedo para que termine la discusión.","Enojarte o ceder son dos caras de la misma reacción. En el medio hay un lugar más tranquilo."],
   [2,"Pongo el límite, pero después dudo si estuve bien.","Poner el límite ya es enseñarles. La duda se va cuando confiás en tu criterio."],
   [3,"Pongo el límite con firmeza y con cariño a la vez.","Firmeza y cariño juntos: así se ve un vínculo sano."]]},
  M:{t:function(c){return "¿Qué hacés para que "+c.hijosTxt+" aprendan que merecen lo bueno?"},o:[
   [1,"Les digo que se cuiden, pero yo no me cuido.","Los hijos aprenden más de lo que ven que de lo que escuchan. Un 1% tuyo, a la vista, ya les enseña."],
   [2,"Empecé a cuidarme delante de ellos, aunque me cuesta.","Te están viendo aprender, y eso también es enseñarles."],
   [3,"Me cuido y me priorizo sin culpa, y ellos lo ven.","Lo enseñás porque lo vivís."]]}},
 familia:{
  R:{t:function(c){return "Cuando estás con "+c.famTxt+", ¿cómo te sentís?"},o:[
   [1,"Vuelvo a sentirme chiquita, como si tuviera que demostrar algo.","Con la familia de origen se activan los pilotos automáticos más viejos. Darte cuenta es el primer paso para no quedar atrapada."],
   [2,"Me doy cuenta de lo que se activa, aunque no siempre lo manejo.","Ver lo que se activa ya cambia el vínculo. El manejo llega con la práctica."],
   [3,"Me siento yo, adulta, sin necesitar su aprobación.","Estar con tu familia desde tu lugar adulto es una de las integraciones más profundas."]]},
  Rp:{t:function(c){return "Cuando pensás en "+c.famTxt+", "+c.famYa+", ¿qué aparece?"},o:[
   [1,"Lo que no pude decir, o lo que nunca recibí.","Lo que no recibiste no define lo que merecés. Hoy podés darte, de a poco, algo de eso que faltó."],
   [2,"Nostalgia, y algunas cosas que todavía estoy acomodando.","Acomodar lleva tiempo, y está bien. No hace falta cerrarlo todo hoy."],
   [3,"Gratitud y paz. Tomo lo que me dejó y elijo lo mío.","Tomar lo bueno y elegir lo propio es honrar sin repetir."]]},
  C:{t:function(c){return "Cuando "+c.famTxt+" opina"+(c.famPl?"n":"")+" sobre tu vida, ¿qué hacés?"},o:[
   [1,"Me justifico, o me callo para no discutir.","Justificarte es pedir permiso para vivir tu vida. Ya no lo necesitás, aunque el cuerpo todavía no lo sepa."],
   [2,"Escucho y a veces respondo, aunque me quedo removida.","Lo que te remueve te muestra dónde todavía buscás aprobación."],
   [3,"Escucho con respeto y decido yo.","Escuchar sin obedecer: así se ve una hija adulta e integrada."]]},
  Cp:{t:function(c){return "Si hoy pudieras decirle"+(c.famPl?"s":"")+" algo, ¿cómo te saldría?"},o:[
   [1,"No me sale. Se me cierra la garganta.","Que se cierre la garganta muestra cuánto hay guardado. Escribirlo, aunque no se lo leas a nadie, ya es expresarlo."],
   [2,"Con mucha emoción, y también con algún reproche.","Emoción y reproche pueden convivir. Escribirlo todo, sin filtro, en una carta puede liberar mucho."],
   [3,"Con un gracias, en paz.","Agradecer desde la paz es la forma más integrada de cerrar."]]},
  M:{t:"¿Qué estás dispuesta a hacer distinto con tu historia familiar?",o:[
   [1,"No sé. Siento que es así y no va a cambiar.","Quizás el otro no cambie, pero tu forma de estar sí. Ahí está tu poder."],
   [2,"Seguir poniendo límites, aunque me sienta culpable.","Cada límite sostenido le quita peso a la culpa."],
   [3,"Tomar lo bueno, soltar lo que no es mío y seguir mi camino.","Esa frase resume la integración."]]}},
 amistades:{
  R:{t:"En tus amistades, ¿quién suele dar más?",o:[
   [1,"Yo. Estoy para todas, pero cuando necesito, no hay nadie.","Si siempre das y nadie está, quizás también te cuesta mostrar que necesitás. Abrirte es parte de recibir."],
   [2,"Estoy equilibrando: aprendí a pedir, aunque todavía me cuesta.","Pedir en la amistad le da a la otra la oportunidad de estar. Vas bien."],
   [3,"Es parejo: nos sostenemos mutuamente.","Amistades de ida y vuelta: un bien que merecés y que sabés cuidar."]]},
  C:{t:"Una amiga hace un comentario que te molesta. ¿Qué hacés?",o:[
   [1,"Me río y lo dejo pasar, aunque me quedo mal.","Reírte para no incomodar te incomoda a vos. Tu malestar también importa."],
   [2,"Se lo digo, aunque después me preocupa haberla ofendido.","Decirlo es cuidar la amistad. La preocupación de después va a ir bajando."],
   [3,"Se lo digo con cariño, en el momento.","Decir las cosas a tiempo es lo que mantiene sanos los vínculos."]]},
  M:{t:"Tenés una amistad que no te hace bien. ¿Qué hacés?",o:[
   [1,"Sigo igual: no me animo a alejarme.","No hace falta cortar hoy. Alcanza con poner un poco más de distancia: ese es tu 1%."],
   [2,"Le empiezo a decir lo que siento, a ver si cambia.","Seguí. Las amistades que soportan la verdad son las que valen."],
   [3,"Tomo distancia sin culpa: elijo con quién estar.","Saber con quién estar es parte de saber dónde pertenecés."]]}},
 trabajo:{
  R:{t:"En tu trabajo, cuando hacés algo bien, ¿qué sentís?",o:[
   [1,"Que no es para tanto: era mi obligación.","Si todo lo que hacés bien es “obligación”, nunca hay lugar para reconocerte. Tu valor también se nota en lo cotidiano."],
   [2,"Satisfacción, aunque espero que alguien lo note.","Ya lo valorás. Fijate si tu satisfacción depende de que otro lo vea."],
   [3,"Orgullo tranquilo, lo note alguien o no.","Tu valor no depende del reconocimiento ajeno. Desde ahí lo podés mostrar sin miedo."]]},
  C:{t:"Querés pedir algo en tu trabajo: un aumento, un cambio, un día libre.",o:[
   [1,"Lo postergo. Siento que no es el momento.","“No es el momento” puede ser real, o puede ser miedo a escuchar un no. Fijate cuál de los dos es."],
   [2,"Lo pido, pero con tantas explicaciones que parezco disculparme.","Probá pedirlo en una sola frase. Tu pedido es válido sin justificativos."],
   [3,"Lo pido con claridad, sabiendo lo que valgo.","Pedir desde tu valor cambia la conversación."]]},
  M:{t:"¿Qué cambiarías en tu forma de trabajar si te sintieras completamente merecedora?",o:[
   [1,"Dejaría de hacer lo que no me corresponde.","Hacer lo que no te corresponde es una forma de ganarte el lugar. Ya lo tenés."],
   [2,"Sostendría los límites de horario que ya empecé a poner.","Los límites de horario son innegociables que protegen tu vida."],
   [3,"Ya trabajo así.","Trabajar desde el merecimiento hace que tu trabajo sea expresión, no sacrificio."]]}},
 clientes:{
  R:{t:"Cuando ponés el precio de lo que ofrecés, ¿qué sentís?",o:[
   [1,"Que es demasiado. Termino cobrando menos o regalando.","Cobrar menos de lo que vale tu trabajo es pedir permiso para existir. Tu precio también habla de cuánto te valorás."],
   [2,"Cobro lo justo, pero me pongo nerviosa al decirlo.","Ya cobrás lo que vale. Los nervios bajan cuando dejás de esperar que el otro lo apruebe."],
   [3,"Cobro lo que vale, con tranquilidad.","Tu precio es una decisión, no una disculpa."]]},
  C:{t:"Alguien te pide un descuento, o algo extra que no está incluido.",o:[
   [1,"Digo que sí, aunque me molesta.","Cada sí que te molesta te cuesta energía. Un “eso no está incluido”, dicho con amabilidad, también es buen servicio."],
   [2,"Digo que no, pero me excuso mucho.","El no ya está. Ahora probalo más corto."],
   [3,"Explico con claridad qué incluye y qué no.","La claridad te cuida a vos y le da seguridad a quien te compra."]]},
  M:{t:"¿Qué harías distinto si te sintieras merecedora de que te vaya muy bien?",o:[
   [1,"Me mostraría más, pero me da vergüenza.","La vergüenza de mostrarte es justo lo que se entrena. Una publicación de 10 segundos ya es un 1%."],
   [2,"Subiría precios y diría que no a lo que no me suma.","Lo tenés claro. Elegí una sola de esas acciones para esta semana."],
   [3,"Ya lo hago: me muevo desde lo que valgo.","Tu emprendimiento refleja tu merecimiento."]]}},
 dinero:{
  R:{t:"Cuando entra dinero inesperado, ¿qué sentís primero?",o:[
   [1,"Que no es para mí: ya tiene destino en otros o en deudas.","Si el dinero siempre se va a otros, quizás sentís que no es para vos. Separar una parte chica para vos ya es un acto de merecimiento."],
   [2,"Alegría, aunque me cuesta usar una parte para mí.","Te alegrás, y eso ya es recibir. Esa incomodidad de usarlo para vos va a ir bajando."],
   [3,"Gratitud, y ganas de usarlo con conciencia, incluyéndome.","Lo recibís, lo cuidás y lo disfrutás: una relación sana con el dinero."]]},
  C:{t:"Cuando hablás de dinero (con tu pareja, tu familia o quien sea), ¿cómo te sale?",o:[
   [1,"Evito el tema: me da vergüenza o miedo.","El dinero es uno de los temas donde más vergüenza se acumula. Nombrarlo es empezar a ordenarlo."],
   [2,"Lo hablo, aunque me pongo tensa.","La tensión no te frena, y eso ya es mucho."],
   [3,"Lo hablo con naturalidad, como cualquier otro tema.","Hablar de dinero sin vergüenza es señal de merecimiento integrado."]]},
  M:{t:"¿Qué hacés hoy para recibir más dinero?",o:[
   [1,"Nada concreto: me da miedo, o siento que no lo merezco.","Ese miedo muestra el techo que te pusiste. Se sube de a 1%: un pedido, un precio, un cobro a tiempo."],
   [2,"Algunas cosas, aunque me freno cuando me toca cobrar o pedir.","Ya te movés. El freno aparece justo en el momento de recibir: ahí está tu práctica."],
   [3,"Me muevo con claridad: pido, cobro y recibo lo que vale mi trabajo.","Estás disponible para la abundancia, y actuás en consecuencia."]]}},
 yo:{
  R:{t:"Al final del día, ¿cuánto te escuchaste a vos?",o:[
   [1,"Muy poco. Escuché a todos menos a mí.","Escuchar a todos menos a vos te aleja de tu centro. Un minuto de silencio al final del día ya es reconocerte."],
   [2,"Bastante, aunque cuando hay presión me olvido.","Bajo presión volvemos al piloto automático. Darte cuenta después ya es parte del cambio."],
   [3,"Me escucho todo el día: sé cómo me siento y qué necesito.","Esa escucha es la base de una vida integrada."]]},
  C:{t:"Si hoy te escribieras una carta, ¿cómo empezaría?",o:[
   [1,"Con todo lo que tengo que mejorar.","Empezar por lo que falta es el hábito de la exigencia. Probá empezar por algo que hiciste bien hoy."],
   [2,"Con lo que estoy trabajando y lo que ya logré.","Valorás tu camino. Probá escribirte sin hablar del proceso, solo de quién sos."],
   [3,"“Te quiero, y estoy orgullosa de quién sos.”","Hablarte con amor, sin condiciones, es el merecimiento hecho palabras."]]},
  M:{t:"¿Qué gesto de cuidado te debés hace tiempo?",o:[
   [1,"Muchos: el médico, el descanso, algo que me guste. Siempre lo postergo.","Elegí uno solo, el más chico, y hacelo esta semana. Ese es tu 1%."],
   [2,"Uno o dos, que ya tengo agendados.","Cumplir lo que te prometés construye confianza con vos misma."],
   [3,"Ninguno: me cuido como parte de mi vida.","El cuidado ya no es una deuda: es tu forma de vivir."]]}}
};

 /* Fase 1 · perfil */
 p_nombre:"Crear cercanía: el resultado le habla por su nombre. Es opcional para no frenar a la que tiene vergüenza de exponerse.",

 p_origen:"Ubicar su lugar en la familia de origen. Filtra la pregunta siguiente: si es hija única, no aparecen opciones de hermanos. A futuro puede afinar patrones (la mayor que cuida a todos, la menor que espera permiso).",
 p_fam:"Detectar el vínculo de origen con más carga: es donde suelen nacer las creencias de no merecer. Define a quién nombran las preguntas de familia (“tu mamá”, “tu hermana”, “quien te crió”).",
 p_presencia:"Ver si ese vínculo está vivo y presente, o si la persona ya no está. Si ya no está, las preguntas de familia cambian de “cuando estás con ella” a “lo que no pudiste decir”: no se le pregunta por un vínculo que no puede ejercer.",
 p_trabajo:"Abrir la rama laboral. Empleada: foco “mi trabajo” (pedir, hacerse ver). Emprendedora: foco “lo que cobro” (precio, descuentos, mostrarse). Si hace las dos cosas, se le ofrecen ambos focos. Es donde el merecimiento se vuelve dinero concreto.",
 p_foco:"La pregunta más importante del perfil: ella elige dónde le duele. Cada vínculo elegido reemplaza una pregunta general en cada etapa, así que siempre son 7 por letra y 21 en total (de 3 a 6 son de sus vínculos) y aparece marcado como “tu foco” en su mapa. Así el recorrido va directo al punto de dolor.",

 R1:"Reconocer su patrón de merecimiento: qué siente cuando algo bueno llega. Define el nombre de su patrón (da y no recibe, se lo tiene que ganar, se achica, espera permiso, recibe) y su primer 1%. Es la única pregunta que no suma al nivel. Siempre aparece primera.",
 R2:"Reconocer en el cuerpo: si nota el freno cuando quiere decir algo. Es el corazón de la R de RCM y de la clase “decí lo que pensás sin pedir permiso”. Alimenta “Tu voz”.",

 R6:"Reconocer qué siente al descansar: si su valor depende de hacer. Con hijos chicos se adapta la situación. Alimenta “Cuidarte”.",

 /* C · Comunicar: cómo se habla a sí misma y cómo les habla a los demás */
 C1:"Comunicación interna: el tono de su voz interior. La opción “estoy en proceso” detecta el nivel 2, la mujer identificada con su proceso. Alimenta “Tu voz”.",

 C3:"Comunicación de su opinión cuando no coincide. Mide directo el “decí lo que pensás sin pedir permiso”. Alimenta “Tu voz”.",
 C4:"Comunicación expuesta: hablar en público, mostrarse en foto o video. Es el dolor principal de tu clienta ideal. Alimenta “Tu voz”.",

 C6:"Comunicación de una necesidad: pedir ayuda. Detecta la falsa fortaleza de “me arreglo sola” y conecta con el deseo de ser sostenida. Alimenta “Tu voz”.",
 C7:"Comunicación del deseo: decir en voz alta lo que quiere. Es la primera que se quita si eligió dos vínculos. Alimenta “Tus decisiones”.",
 /* M · Moverte: qué hace, qué elige, qué acción sostiene */

function etapa(f,c){

 c.foco.forEach(function(ar){

  var key=f;
  if(ar==="familia"&&c.presencia==="partio"&&bank[f+"p"])key=f+"p";
  var q=bank[key];
  out.push({id:ar+"_"+key,fase:f,area:ar,t:q.t,o:q.o});
 });
 var gen=GENERAL.filter(function(q){return q.fase===f}).slice(0,7-out.length);
 /* las preguntas de su foco se intercalan: posición 3 y 6 de cada etapa */
 var res=gen.slice();
 if(out[0])res.splice(2,0,out[0]);
 if(out[1])res.splice(5,0,out[1]);
 return res.slice(0,7);
}

  '<div class="card" id="contacto"><span class="pk">Opcional</span><p>¿Querés que Rodrigo te escriba sobre tu resultado? Dejá tu WhatsApp o tu email.</p><label class="vh" for="cto">WhatsApp o email</label><input id="cto" type="text" autocomplete="email" placeholder="WhatsApp o email"><div class="row"><button class="btn ghost" type="button" id="cto-ok">Enviar</button></div><p class="nota" id="cto-msg" role="status"></p></div>'+

/* ---------- Modo prueba ---------- */
function renderPrueba(f,c){
 var p=document.getElementById("prueba");
 p.hidden=!PRUEBA;if(!PRUEBA)return;
 var qs=f.filter(function(s){return s.tipo==="pregunta"&&/^[RCM]$/.test(s.fase)}).map(function(s){return s.id});
 var R=calcular();
 p.innerHTML='<b>Modo creador</b> · perfil: '+esc([c.edad,c.pareja,c.hijos,c.origen,c.fam,c.presencia,c.trabajo].filter(Boolean).join(" / "))+
  '<br>foco: '+esc(c.foco.join(", ")||"–")+' · preguntas de la fase 3 ('+qs.length+'): '+esc(qs.join(" "))+
  '<br>promedio actual: '+R.avg.toFixed(2)+' → nivel '+R.nivel+' · patrón: '+R.patron+
  '<br>registros guardados en este navegador: '+(function(){try{return JSON.parse(localStorage.getItem(REG_LOCAL)||"[]").length}catch(e){return 0}})()+' · envío a planilla: '+(REGISTRO_URL?'activo':'sin configurar')+
  '<div class="row"><button class="btn ghost sm" type="button" id="azar">Completar al azar hasta el final</button><button class="btn ghost sm" type="button" id="vercsv">Ver registros (CSV)</button></div><textarea id="csvout" hidden readonly rows="8" style="width:100%;margin-top:8px;background:#0e0c09;color:#bdb19c;border:1px solid #3a3127;font:12px monospace"></textarea>';
 document.getElementById("azar").onclick=azar;
 document.getElementById("vercsv").onclick=function(){var t=document.getElementById("csvout");t.value=csv();t.hidden=false;t.select()};
}
function azar(){
 var guard=0;
 while(guard++<200){
  var f=flow(),i=f.findIndex(function(s){return s.id===S.pos});if(i<0)i=0;var s=f[i],c=ctx();
  if(s.tipo==="resultado")break;
  if(s.tipo==="texto")S.a.p_nombre="Prueba";
  if(s.tipo==="perfil"){var o=opts(s.q,c);S.a[s.q.id]=o[Math.floor(Math.random()*o.length)][0];limpiarRamas()}
  if(s.tipo==="multi"){var o2=opts(s.q,c).map(function(x){return x[0]}).sort(function(){return Math.random()-.5});S.a[s.q.id]=o2.slice(0,1+Math.floor(Math.random()*2))}
  if(s.tipo==="pregunta")S.a[s.id]=Math.floor(Math.random()*s.q.o.length);
  S.pos=f[i+1].id;
 }
 save();render();window.scrollTo(0,0);
}

document.getElementById("atras").onclick=back;
document.getElementById("modo").onclick=function(){PRUEBA=!PRUEBA;this.setAttribute("aria-pressed",PRUEBA);render()};
var prev=load();if(prev){S=prev;S.pos="inicio"}if(!S.id)S.id=nuevoId();
render();

</script>
