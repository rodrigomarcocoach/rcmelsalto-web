<style>
:root{--bg:#0b0a08;--card:#16120d;--card2:#1d1813;--line:#3a3022;--text:#f2ece0;--muted:#b3a893;--gold:#d9a93f;--gold2:#f1cf79;--ok:#7fd6a4;--serif:'Cormorant Garamond',Georgia,serif;--sans:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:400 17px/1.55 var(--sans)}
.top{position:sticky;top:0;z-index:5;background:rgba(11,10,8,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .in{max-width:620px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;align-items:center;gap:12px}
.top img{width:34px;height:34px;flex:none}
.top .meta{flex:1;min-width:0;display:flex;flex-direction:column}
#fase{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold2)}
#cuenta{font-size:13px;color:var(--muted)}
.icon{background:none;border:1px solid var(--line);color:var(--text);border-radius:999px;min-height:40px;padding:0 14px;font:500 14px var(--sans);cursor:pointer}
.bar{height:4px;background:var(--line)}#fill{display:block;height:100%;width:0;background:var(--gold);transition:width .4s}
main{max-width:620px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.hero{background:linear-gradient(180deg,var(--card2),var(--card))}
.card.g{border-color:var(--gold)}
h1,h2{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance;line-height:1.12}
h1{font-size:clamp(34px,8.5vw,46px)}h2{font-size:clamp(25px,6vw,31px)}
.gold{color:var(--gold2)}
p{margin:0}.lead{font-size:18px}.sub{color:var(--muted);font-size:15px}
.pk{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:700}
.nota{font-size:13px;color:var(--muted)}
.mini{margin:0;padding-left:20px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:54px;padding:0 26px;border-radius:999px;border:0;background:var(--gold);color:#1a140c;font:700 16px var(--sans);text-decoration:none;cursor:pointer;text-align:center}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn:focus-visible,.opt:focus-visible,.icon:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:block;text-align:left;width:100%;min-height:56px;padding:14px 16px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);font:400 16px/1.4 var(--sans);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--gold)}
.opt.sel{border-color:var(--gold);background:#2a2114}
.punto{border-left:3px solid var(--gold);background:#1f1810;border-radius:0 12px 12px 0;padding:16px;display:flex;flex-direction:column;gap:10px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.niveles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.niveles span{font-size:12px;text-align:center;padding:8px 4px;border-radius:8px;border:1px solid var(--line);color:var(--muted)}
.niveles span.on{background:var(--gold);border-color:var(--gold);color:#1a140c;font-weight:700}
.big{font-family:var(--serif);font-size:25px;line-height:1.22;color:var(--gold2)}
.offer{border-color:var(--gold);background:linear-gradient(180deg,#221a10,var(--card))}
.precio{font-family:var(--serif);font-size:40px;font-weight:600;line-height:1}.precio s{font-family:var(--sans);font-size:18px;font-weight:400;color:var(--muted);margin-right:8px}
.incl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.incl li{display:flex;gap:10px}.incl li:before{content:"✓";color:var(--gold2);font-weight:700}
input[type=text]{font:400 17px var(--sans);min-height:52px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--text);width:100%}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</head>
<body>
<header class="top">
 <div class="in">
  <a href="/" aria-label="Método RCM, inicio"><img src="/assets/logo-rcm-96.png" alt="Método RCM 1%" width="34" height="34"></a>
  <div class="meta"><span id="fase">Test RCM</span><span id="cuenta">7 preguntas · 3 minutos</span></div>
  <button class="icon" id="atras" type="button" hidden>Atrás</button>
 </div>
 <div class="bar"><span id="fill"></span></div>
</header>
<main id="app" aria-live="polite"></main>
<script>
/* Test RCM · 7 preguntas. Lleva al checkout del ebook y guarda cada test en la planilla de Merecer 21 (origen "test7"). */
var CHECKOUT="https://metodorcm.impultienda.ar/";
var REGISTRO_URL="https://script.google.com/macros/s/AKfycbzP6kPBeia2Mx-qn9pywfrXpaLubPFljLRT_vBaFHwx3OMQSPPVeLM5kmsHUoWMft4D/exec";
var FASES={R:"Reconocer",C:"Comunicar",M:"Moverte"};

var NIVELES={
 1:{nombre:"La que tiene la información",desc:"Sabés mucho de lo que querés cambiar. Pero en el momento, el cuerpo reacciona antes que la cabeza: decís que sí, te callás o pedís perdón. No es poco: ya miraste hacia adentro. Lo que falta es pasar de saber a aplicar, de a 1%."},
 2:{nombre:"La que sabe y aplica",desc:"Ya empezaste a aplicar: a veces te sale y a veces no. Ponés límites, pero después aparece la culpa, o te quedás dándole vueltas. Lo que falta es que deje de costarte y se vuelva tu forma de estar."},
 3:{nombre:"La que integra",desc:"Ya no lo pensás tanto: lo hacés. Decís que no con calma y elegís desde lo que querés. Lo que sigue es sostenerlo y aplicarlo en todas las áreas de tu vida, en coherencia y excelencia."}
};
var PATRONES={
 da:{nombre:"La que da y no recibe",desc:"Sos generosa con todos, pero cuando algo llega para vos aparece la necesidad de devolverlo enseguida.",accion:"Hoy, cuando alguien te dé algo, respondé solo “gracias” y respirá una vez antes de decir otra cosa."},
 gana:{nombre:"La que se lo tiene que ganar",desc:"Sentís que lo bueno llega recién después de esforzarte lo suficiente. Y lo suficiente nunca termina de llegar.",accion:"Hoy hacé algo agradable para vos sin habértelo ganado: 30 segundos de sol, un café tranquila, una canción entera, o un momento de respiración consciente y agradecimiento."},
 achica:{nombre:"La que se achica",desc:"Para no incomodar ni quedar expuesta, le bajás el volumen a lo que sos, a lo que sabés y a lo que querés.",accion:"Hoy decí una opinión tuya en una sola frase, sin poner “no sé” ni “capaz” adelante."},
 permiso:{nombre:"La que espera permiso",desc:"Antes de disfrutar o de decidir, esperás que alguien te confirme que está bien.",accion:"Hoy tomá una decisión chica sin consultarla con nadie: qué comer, qué ponerte, a dónde ir."},
 recibe:{nombre:"La que recibe",desc:"Recibir ya no te incomoda: sabés que lo bueno también es para vos.",accion:"Hoy llevá esa misma forma de recibir al vínculo donde todavía te cuesta poner un límite."}
};

/* Cada opción: [nivel o patrón, texto, punto de conciencia] */
var PREGUNTAS=[
 {id:"R1",f:"R",patron:true,t:"Cuando algo bueno llega a tu vida, ¿qué es lo primero que sentís?",o:[
  ["da","Ganas de devolverlo o compensarlo enseguida.","Si recibir te deja en deuda, en algún momento aprendiste que el amor se paga. Hoy alcanza con notarlo, sin culpa ni reproche."],
  ["gana","Que todavía no hice lo suficiente para merecerlo.","El “todavía no” es una vara que te pusiste vos, y se corre cada vez un poco más lejos. Notá cuándo aparece: reconocer lo que ya hiciste y elegir recibirlo es una decisión consciente, no un premio."],
  ["achica","Ganas de minimizarlo para no incomodar a nadie.","Achicarte para que nadie se incomode tiene un costo: te incomodás vos."],
  ["permiso","Necesidad de que alguien me confirme que está bien disfrutarlo.","Esperar permiso es dejar la llave de tu bienestar en manos de otro. Esa llave es tuya."],
  ["recibe","Gratitud. Lo recibo sin cuentas pendientes.","Recibir con gratitud, sin deber nada a cambio, es merecimiento integrado."]]},
 {id:"R2",f:"R",t:"Cuando querés decir algo y te frenás, ¿lo notás en el cuerpo?",o:[
  [1,"No me doy cuenta en el momento. Lo noto después, cuando ya pasó.","El cuerpo avisa antes que la mente: un nudo, calor, la garganta cerrada. Notarlo, aunque sea después, ya es reconocer."],
  [2,"Sí, siento algo (garganta, pecho, panza), aunque no siempre sé qué es.","Ya escuchás la señal. El próximo paso es ponerle nombre: nombrarlo le baja el volumen."],
  [3,"Lo reconozco enseguida y sé qué me está diciendo.","Leer tu cuerpo en el momento te deja elegir en lugar de reaccionar."]]},
 {id:"R4",f:"R",t:"Cuando algo te molesta, ¿cuánto tardás en darte cuenta?",o:[
  [1,"Mucho. Me doy cuenta días después, o cuando exploto.","Si te das cuenta tarde, es porque aprendiste a no sentir para no molestar. Lo que no se reconoce se acumula hasta que desborda."],
  [2,"Lo noto en el momento, pero no siempre sé bien qué siento.","Ya lo registrás a tiempo. Preguntate “¿qué siento ahora mismo?” y “¿qué me despierta?”: dos preguntas que ordenan."],
  [3,"Lo reconozco enseguida y puedo nombrar qué siento.","Nombrar lo que sentís en el momento es la base de un límite sin reproche."]]},
 {id:"C1",f:"C",t:"Cuando algo te sale mal, ¿cómo te hablás?",o:[
  [1,"Con dureza: “otra vez lo mismo, no aprendo más”.","Esa voz no nació con vos: la aprendiste. Probá hablarte como le hablarías a tu mejor amiga, aunque sea una frase."],
  [2,"Me corrijo: “estoy en proceso, estoy trabajando esto”.","Fijate si “estoy en proceso” no es una manera de evitar responsabilidad y de justificarte en el camino."],
  [3,"“Me equivoqué. ¿Qué es lo mejor que puedo hacer con lo que tengo disponible?”","Te hablás con respeto y tomás acción."]]},
 {id:"C2",f:"C",t:"Te piden algo que no querés hacer. ¿Qué respondés?",o:[
  [1,"Digo que sí, y después me arrepiento y me enojo conmigo.","Cada sí que no sentís te aleja un poco de vos. Ese enojo de después es información: te muestra dónde está tu límite."],
  [2,"A veces digo que no, y me quedo un rato dándole vueltas.","Ya ponés límites. Las vueltas son la culpa latente: con práctica disminuyen, se acortan y aparece nueva evidencia."],
  [3,"Digo que no con calma, sin explicar de más.","Un “no” tranquilo cuida el vínculo más que un sí con enojo o por compromiso."]]},
 {id:"C3",f:"C",t:"Alguien dice algo con lo que no estás de acuerdo. ¿Qué decís?",o:[
  [1,"Nada. Me callo para no generar conflicto.","Callarte te protege de quedar expuesta, pero te deja afuera de tu propia vida. Tu opinión también merece lugar."],
  [2,"Lo digo, pero lo suavizo tanto que casi no se entiende.","Ya hablás. El próximo 1% es decir una sola frase clara, sin almohadones."],
  [3,"Lo digo con respeto, aunque el otro no esté de acuerdo.","No necesitás que te den la razón para sostener lo que pensás."]]},
 {id:"M1",f:"M",t:"Leés o escuchás algo que te inspira. ¿Qué hacés después?",o:[
  [1,"Lo guardo o lo comparto, pero en mi día a día no cambio nada.","Esta es la diferencia entre tener la información y aplicarla. No hace falta aplicar todo: alcanza con una acción chica, hoy."],
  [2,"Intento aplicarlo unos días, hasta que la rutina me gana.","Ya pasás a la acción. Lo que falta es que sea tan chico que la rutina no pueda ganarle: eso es el 1%."],
  [3,"Elijo una sola acción chica y la hago ese mismo día.","Convertir la inspiración en acción el mismo día es integrar."]]}
];

var S={i:-1,a:{},id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),t0:Date.now()};
var app=document.getElementById("app"),fill=document.getElementById("fill"),atras=document.getElementById("atras");
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}
function el(h){var d=document.createElement("div");d.innerHTML=h.trim();return d.firstChild}
function hdr(f,c,p){document.getElementById("fase").textContent=f;document.getElementById("cuenta").textContent=c;fill.style.width=p+"%"}
function checkoutUrl(){var q=location.search||"";return CHECKOUT+(q?(q.charAt(0)==="?"?q:"?"+q):"")}
function go(i){S.i=i;app.innerHTML="";window.scrollTo(0,0);atras.hidden=i<0||i>=PREGUNTAS.length;if(i<0)inicio();else if(i<PREGUNTAS.length)pregunta(i);else resultado()}
atras.onclick=function(){if(S.i>0)go(S.i-1);else go(-1)};

function inicio(){
 hdr("Test RCM","7 preguntas · 3 minutos",0);
 var s=el('<section class="card hero"><p class="pk">Gratis · 3 minutos</p><h1>¿Ponés un límite y te sentís <span class="gold">mala persona</span>?</h1><p class="lead">7 preguntas para ver desde dónde partís. Al final te llevás tu nivel, tu patrón y tu primer 1%: una acción de menos de 30 segundos para hoy.</p><ul class="mini"><li>Reconocer, Comunicar y Moverte.</li><li>Respondé lo que te pasa, no lo que te gustaría.</li></ul><div><button class="btn full" type="button">Empezar el test</button></div><p class="nota">No es un test psicológico ni un diagnóstico. Es un ejercicio de entrenamiento de la mentalidad del Método RCM, de Rodrigo Marco.</p></section>');
 s.querySelector("button").onclick=function(){go(0)};app.appendChild(s);
}

function pregunta(i){
 var q=PREGUNTAS[i];hdr(FASES[q.f],"Pregunta "+(i+1)+" de "+PREGUNTAS.length,Math.round(i/PREGUNTAS.length*100));
 var s=el('<section class="card"><p class="pk">'+FASES[q.f]+'</p><h2>'+esc(q.t)+'</h2><div class="opts" role="radiogroup"></div><div class="slot"></div></section>');
 var box=s.querySelector(".opts"),slot=s.querySelector(".slot");
 q.o.forEach(function(o,j){
  var b=el('<button class="opt" type="button" role="radio" aria-checked="false">'+esc(o[1])+'</button>');
  if(S.a[q.id]===j){b.classList.add("sel");b.setAttribute("aria-checked","true")}
  b.onclick=function(){S.a[q.id]=j;[].forEach.call(box.children,function(x){x.classList.remove("sel");x.setAttribute("aria-checked","false")});b.classList.add("sel");b.setAttribute("aria-checked","true");punto(slot,o,i)};
  box.appendChild(b)});
 if(S.a[q.id]!==undefined)punto(slot,q.o[S.a[q.id]],i);
 app.appendChild(s);
}
function punto(slot,o,i){
 slot.innerHTML="";var last=i===PREGUNTAS.length-1;
 var p=el('<div class="punto"><p>'+esc(o[2])+'</p><div><button class="btn" type="button">'+(last?"Ver mi resultado":"Siguiente")+'</button></div></div>');
 p.querySelector("button").onclick=function(){go(i+1)};slot.appendChild(p);
 p.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function calcular(){
 var sum=0,n=0,patron="gana";
 PREGUNTAS.forEach(function(q){var j=S.a[q.id];if(j===undefined)return;var v=q.o[j][0];if(q.patron)patron=v;else{sum+=v;n++}});
 var avg=n?sum/n:1;var nivel=avg<1.67?1:avg<2.34?2:3;return {avg:avg,nivel:nivel,patron:patron};
}
function registrar(R,extra){
 var row={id:S.id,origen:"test7",fecha:new Date().toISOString(),duracion_min:Math.round((Date.now()-S.t0)/60000),nivel:R.nivel+" · "+NIVELES[R.nivel].nombre,promedio:R.avg.toFixed(2),patron:PATRONES[R.patron].nombre,utm:location.search||""};
 PREGUNTAS.forEach(function(q,k){var j=S.a[q.id];row["T"+(k+1)]=j===undefined?"":q.id+" | "+(q.patron?q.o[j][0]:"N"+q.o[j][0])+" | "+q.o[j][1]});
 if(extra)for(var k in extra)row[k]=extra[k];
 try{fetch(REGISTRO_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(extra&&extra.contacto?{id:S.id,contacto:extra.contacto}:row)}).catch(function(){})}catch(e){}
}

function resultado(){
 var R=calcular(),N=NIVELES[R.nivel],P=PATRONES[R.patron];
 hdr("Tu resultado","Test completo",100);
 if(!S.enviado){registrar(R);S.enviado=true}
 var niv=[1,2,3].map(function(n){return '<span class="'+(n===R.nivel?"on":"")+'">'+["Tiene la información","Sabe y aplica","Integra"][n-1]+'</span>'}).join("");
 var puente=R.nivel===3?"Ya lo hacés. El plan de 7 días te ayuda a sostenerlo justo donde todavía te cuesta.":"No te falta información. Te falta un plan chico para aplicarla, un día a la vez.";
 var sec=el('<section style="display:flex;flex-direction:column;gap:16px">'+
  '<div class="card hero"><p class="pk">Tu resultado</p><h1>Este es tu punto de partida</h1></div>'+
  '<div class="card"><p class="pk">Tu nivel</p><h2 class="gold">'+esc(N.nombre)+'</h2><div class="niveles" aria-hidden="true">'+niv+'</div><p>'+esc(N.desc)+'</p></div>'+
  '<div class="card"><p class="pk">Tu patrón</p><h2 class="gold">'+esc(P.nombre)+'</h2><p>'+esc(P.desc)+'</p></div>'+
  '<div class="card g"><p class="pk">Tu primer 1% para hoy</p><p class="big">'+esc(P.accion)+'</p></div>'+
  '<div class="card offer"><p class="pk">Tu siguiente paso</p><h2>Decí que no sin sentirte mala persona</h2>'+
   '<p>'+esc(puente)+' Tu patrón es <b>'+esc(P.nombre.toLowerCase())+'</b>: el plan de 7 días empieza por ahí.</p>'+
   '<ul class="incl"><li>Ebook con el plan de 7 días: una acción de 1 a 30 segundos por día</li><li>Plan para imprimir, con casillero para marcar “lo hice”</li><li>11 tarjetas del 1% para el celular</li><li>Regalo: el recorrido completo Merecer 21</li></ul>'+
   '<p class="precio"><s>USD 19</s>USD 9</p><p class="sub">En Argentina lo pagás en pesos con Mercado Pago.</p>'+
   '<a class="btn full" id="comprar" href="'+esc(checkoutUrl())+'">Ver el plan de 7 días</a>'+
   '<p class="nota"><b>Garantía:</b> hacé el plan de 7 días. Si lo aplicaste y no te sirvió, te devuelvo tu plata.</p></div>'+
  '<div class="card"><p class="pk">Opcional</p><p>¿Querés que Rodrigo te escriba sobre tu resultado? Dejá tu WhatsApp o tu email.</p><label class="vh" for="cto">WhatsApp o email</label><input id="cto" type="text" autocomplete="email" placeholder="WhatsApp o email"><div class="row"><button class="btn ghost" type="button" id="cto-ok">Enviar</button></div><p class="nota" id="cto-msg" role="status"></p></div>'+
  '<p class="nota">Este test es un ejercicio de entrenamiento de la mentalidad. No es un test psicológico ni un diagnóstico. Si estás atravesando una situación de violencia, la Línea 144 atiende en Argentina, gratis, las 24 horas. <a href=\"/privacidad/\" style=\"color:var(--gold2)\">Privacidad</a>.</p>'+
  '<div class="row" style="justify-content:center"><button class="btn ghost" type="button" id="otra">Volver a empezar</button></div></section>');
 app.appendChild(sec);
 document.getElementById("cto-ok").onclick=function(){var v=document.getElementById("cto").value.trim();var m=document.getElementById("cto-msg");if(v.length<5){m.textContent="Escribí tu WhatsApp o tu email.";return}registrar(R,{contacto:v});m.textContent="Listo. Rodrigo te va a escribir.";this.disabled=true};
 document.getElementById("otra").onclick=function(){S={i:-1,a:{},id:Date.now().toString(36)+Math.random().toString(36).slice(2,7),t0:Date.now()};go(-1)};
}
go(-1);
</script>
</body>
</html>
